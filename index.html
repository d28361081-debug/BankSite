<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUSTIX BANK // Terminal Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        
        <div id="auth-screen" class="terminal-card">
            <h1 class="blink-text">====== TRUSTIX BANK ======</h1>
            <p class="system-status">STATUS: ONLINE // SECURE_CONNECTION</p>
            <hr>
            <div class="form-group">
                <label>ИДЕНТИФИКАТОР ПОЛЬЗОВАТЕЛЯ (ЛОГИН):</label>
                <input type="text" id="username" placeholder="Введите имя..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>КРИПТО-ПАРОЛЬ (ДОСТУП):</label>
                <input type="password" id="password" placeholder="Введите пароль...">
            </div>
            <hr>
            <div class="button-group">
                <button id="login-btn" class="btn-primary">ВХОД В СИСТЕМУ</button>
                <button id="register-btn" class="btn-secondary">РЕГИСТРАЦИЯ</button>
            </div>
        </div>

        <div id="app-screen" class="terminal-card hidden">
            <div class="card-header">
                <h2>ПАНЕЛЬ УПРАВЛЕНИЯ: <span id="user-login-name">...</span></h2>
                <button id="logout-btn" class="btn-danger">ВЫХОД</button>
            </div>
            <p class="tech-id-label">ТЕХНИЧЕСКИЙ ID: <span id="user-tech-id">...</span></p>
            <hr>
            
            <div class="balance-section">
                <h3>ДОСТУПНЫЙ БАЛАНС:</h3>
                <div class="balance-display"><span id="user-balance">0.00</span> ¤</div>
            </div>
            <hr>

            <div class="transfer-section">
                <h3>МЕЖБАНКОВСКИЙ ПЕРЕВОД</h3>
                <div class="form-group">
                    <label>ПОЛУЧАТЕЛЬ (ЛОГИН):</label>
                    <input type="text" id="target-user" placeholder="Имя получателя...">
                </div>
                <div class="form-group">
                    <label>СУММА ПЕРЕВОДА (¤):</label>
                    <input type="number" id="transfer-amount" placeholder="0.00" min="1">
                </div>
                <button id="send-btn" class="btn-primary" style="width: 100%;">ВЫПОЛНИТЬ ТРАНЗАКЦИЮ</button>
            </div>
            <hr>

            <div class="history-section">
                <h3>ПОСЛЕДНИЕ ЛОГИ ОПЕРАЦИЙ</h3>
                <ul id="history-list" class="history-log">
                    </ul>
            </div>
        </div>

        <div id="admin-screen" class="terminal-card hidden">
            <div class="card-header">
                <h2 style="color: #ff5555;">ТЕРМИНАЛ РАЗРАБОТЧИКА (ADMIN)</h2>
                <button id="admin-logout-btn" class="btn-danger">ВЫХОД</button>
            </div>
            <hr>
            <h3>УПРАВЛЕНИЕ УЧЁТНЫМИ ЗАПИСЯМИ</h3>
            <div id="admin-users-list" class="admin-users-scroll">
                </div>
        </div>

    </div>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>
</html>
